<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>True / False</title>
<meta name="description" content="A daily deck of incredible true stories, popular myths and convincing fakes. Swipe: true or false?">
<meta name="theme-color" content="#1e1c19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="True/False">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html { background: #1e1c19; -webkit-text-size-adjust: 100%; }
  .app { padding-top: max(10px, env(safe-area-inset-top)) !important; padding-bottom: max(14px, env(safe-area-inset-bottom)) !important; }
  body { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  /* Layout: one-screen phone app — top bar, a paper story card that swipes and flips, an action bar. Single dark look by design. */
  :root {
    --ground: #1e1c19;
    --ground-2: #2a2723;
    --fg: #efe9dd;
    --muted: #9b9285;
    --paper: #d6cfbf;
    --ink: #2b2723;
    --ink-soft: #5a5348;
    --band: #574e42;
    --box: #2a2724;
    --gold: #e2b545;
    --true: #4d7d43;
    --myth: #a8352c;
    --fake: #5a3f8f;
    --display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    --body: 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--fg);
    font-family: var(--body); -webkit-tap-highlight-color: transparent;
    overflow: hidden; overscroll-behavior: none;
  }
  .app {
    height: 100%; max-width: 440px; margin: 0 auto;
    display: grid; grid-template-rows: auto 1fr auto;
    padding-inline: 16px; padding-block: 10px 14px; gap: 12px;
  }

  /* top bar */
  .top { display: grid; gap: 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wordmark { font: 700 18px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .wordmark span { color: var(--gold); }
  .score { display: flex; align-items: center; gap: 8px; background: var(--ground-2); border-radius: 999px; padding: 6px 14px 6px 10px; font: 600 17px/1 var(--display); font-variant-numeric: tabular-nums; }
  .score svg { width: 18px; height: 18px; fill: var(--gold); }
  .score.bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  .progress { display: flex; align-items: center; gap: 10px; }
  .segs { flex: 1; display: flex; gap: 4px; }
  .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--ground-2); }
  .seg.ok { background: var(--true); }
  .seg.bad { background: var(--myth); }
  .seg.now { background: var(--muted); }
  .count { font: 500 13px/1 var(--display); color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }

  /* card stage */
  .stage { position: relative; min-height: 0; perspective: 1400px; }
  .wrap { position: absolute; inset: 0; touch-action: none; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .wrap.leaving { transform: translateX(-115%) rotate(-10deg); opacity: 0; }
  .wrap.entering { transform: translateX(115%) rotate(10deg); opacity: 0; transition: none; }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
  .inner.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse at center, rgba(255,255,255,0) 55%, rgba(80,60,30,.16) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .back { transform: rotateY(180deg); }

  .head { display: flex; gap: 4px; padding: 12px 12px 0; flex: none; }
  .num { width: 50px; background: var(--box); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding-block: 6px; }
  .num small { font: 600 10px var(--display); color: var(--gold); letter-spacing: .1em; }
  .num b { font: 700 24px var(--display); }
  .title { flex: 1; min-width: 0; background: var(--band); color: #f5f1e8; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px 8px 14px; }
  .title .flag { align-self: flex-start; margin-top: 2px; width: 30px; height: 20px; flex: none; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.35); }
  .title .flag svg { display: block; width: 100%; height: 100%; }
  .title .flag.world { margin-top: 0; width: 24px; height: 24px; border-radius: 50%; box-shadow: none; }
  .title .tl { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .title h2 { margin: 0; font: 700 23px/1.05 var(--display); text-transform: uppercase; text-wrap: balance; }
  .seal { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font: 700 17px/1 var(--display); }

  .art { position: relative; flex: 1 1 auto; min-height: 150px; margin: 4px 12px 0; background: #000; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .badges { position: absolute; left: 0; right: 0; bottom: -38px; display: flex; justify-content: center; align-items: flex-start; gap: 12px; }
  .shield { position: relative; width: 84px; height: 72px; }
  /* the shield is a stroked SVG shape: the paper outline is exactly 4px on every edge, slanted ones and the tip included */
  .shield .sh { position: absolute; left: 4px; top: 4px; width: 76px; height: 64px; overflow: visible; }
  .shield .sh polygon { fill: var(--box); stroke: var(--paper); stroke-width: 8px; stroke-linejoin: miter; stroke-miterlimit: 4; paint-order: stroke; }
  .shield .sh polygon.edge { fill: none; stroke: rgba(70,62,52,.55); stroke-width: 10px; }
  .shield div { position: relative; height: 100%; color: var(--fg); display: flex; flex-direction: column; align-items: center; padding-top: 13px; }
  .shield b { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .shield em { font: 600 9px/1 var(--display); font-style: normal; letter-spacing: .16em; color: var(--gold); margin-top: 3px; }
  .square { width: 64px; height: 64px; padding: 4px; background: var(--paper); margin-top: 2px; box-shadow: 0 0 0 1px rgba(70,62,52,.55); }
  .square div { height: 100%; background: var(--box); display: flex; align-items: center; justify-content: center; }
  .square svg { width: 34px; height: 34px; }

  .story { flex: none; padding: 50px 20px 18px; text-align: center; font-size: 17px; line-height: 1.38; }
  .story p { margin: 0; }

  /* swipe stamps on the front */
  .vote-stamp { position: absolute; top: 22%; font: 700 30px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 6px 14px 8px; border: 4px solid currentColor; border-radius: 6px; background: rgba(214,207,191,.88); opacity: 0; pointer-events: none; z-index: 2; }
  .vote-stamp.yes { left: 18px; color: var(--true); transform: rotate(-12deg); }
  .vote-stamp.no { right: 18px; color: var(--myth); transform: rotate(12deg); }

  /* back */
  .strip { position: relative; flex: none; height: 118px; margin: 4px 12px 0; background: #000; }
  .strip img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.6) brightness(.8); display: block; }
  .verdict { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%) rotate(-5deg); font: 700 44px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 6px 22px 9px; border: 5px solid currentColor; border-radius: 8px; background: rgba(214,207,191,.94); white-space: nowrap; }
  .verdict.true { color: var(--true); }
  .verdict.myth { color: var(--myth); }
  .verdict.fake { color: var(--fake); }
  .frame-q { font: 600 10px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .reveal { flex: 1; min-height: 0; overflow-y: auto; padding: 44px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
  .you { align-self: center; font: 600 14px/1.2 var(--display); letter-spacing: .04em; padding: 7px 12px; border-radius: 4px; color: #f5f1e8; text-align: center; }
  .you.ok { background: var(--true); }
  .you.bad { background: var(--myth); }
  .label { font: 600 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
  .answer { font-size: 16px; line-height: 1.42; display: grid; gap: 10px; }
  .answer p { margin: 0; }
  .source { margin: 4px 0 0; font-size: 12.5px; line-height: 1.35; font-style: italic; color: var(--ink-soft); text-align: center; }

  /* end screen */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 24px; border-radius: 18px; background: var(--ground-2); }
  .end h2 { margin: 0; font: 700 34px/1.05 var(--display); text-transform: uppercase; text-wrap: balance; }
  .end .big { font: 700 72px/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
  .end p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.4; max-width: 30ch; }

  /* start screen, deck of card backs */
  .start { position: absolute; inset: 0; }
  .deck { position: absolute; left: 0; right: 0; top: 0; bottom: 112px; }
  .cb {
    position: absolute; left: 50%; top: 50%; height: min(80%, 370px); aspect-ratio: 2 / 3; /* same proportions as back-munchausen.jpg, so nothing is cropped */
    border-radius: 16px; padding: 0; overflow: hidden; transform: translate(-50%, -50%);
    background: #3a332b;
    box-shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.32);
  }
  .cb-in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .cb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .cb-seal { width: 30%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font: 700 clamp(34px, 11vw, 56px)/1 var(--display); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .start-copy { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; display: grid; align-content: center; gap: 6px; text-align: center; transition: opacity .25s; }
  .start-copy h2 { margin: 0; font: 700 28px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .start-copy p { margin: 0 auto; max-width: 32ch; text-wrap: pretty; color: var(--muted); font-size: 15px; line-height: 1.4; }
  .btn:disabled { opacity: .55; cursor: default; }

  .pills { display: flex; gap: 6px; align-items: center; }
  .lang { appearance: none; border: 1px solid #4a443c; background: transparent; color: var(--fg); border-radius: 999px; height: 29px; min-width: 40px; padding: 0 10px; font: 600 13px/1 var(--display); letter-spacing: .1em; cursor: pointer; }
  .lang:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .lang:disabled { opacity: .4; }
  .lang.icon { min-width: 29px; width: 29px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .lang.icon svg { width: 15px; height: 15px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: min(440px, 100%); background: var(--ground-2); color: var(--fg); border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.4); }
  .sheet h3 { margin: 0 0 4px; font: 700 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .sheet .opt { appearance: none; border: 1px solid #4a443c; background: #34302a; color: var(--fg); border-radius: 10px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 3px; }
  .sheet .opt b { font: 600 17px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .sheet .opt span { font-size: 14px; color: var(--muted); }
  .sheet .opt.warn b { color: #e07a6f; }
  .sheet .opt:focus-visible, .sheet .cancel:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sheet .cancel { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 12px; cursor: pointer; }
  .wordmark { white-space: nowrap; }
  .streak { display: flex; align-items: center; gap: 6px; background: var(--ground-2); border-radius: 999px; padding: 6px 12px 6px 9px; font: 600 17px/1 var(--display); font-variant-numeric: tabular-nums; }
  .streak svg { width: 16px; height: 16px; fill: #e8833a; }
  .streak b { font: 700 12px/1 var(--display); color: var(--ground); background: #e8833a; border-radius: 4px; padding: 3px 5px; letter-spacing: .04em; }
  .hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
  .hint span { font-size: 13px; color: var(--muted); }
  .bet { appearance: none; border: 2px solid var(--gold); background: transparent; color: var(--gold); border-radius: 999px; height: 34px; padding: 0 14px; font: 700 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; flex: none; transition: background .15s, color .15s; }
  .bet[aria-pressed="true"] { background: var(--gold); color: var(--ground); }
  .bet:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .wrap.bet-on .front { box-shadow: 0 0 0 3px var(--gold), 0 18px 40px rgba(0,0,0,.45); }
  .timer { position: absolute; left: 0; right: 0; top: 0; height: 8px; z-index: 4; background: rgba(43,39,35,.22); }
  .timer i { display: block; height: 100%; width: 100%; background: var(--gold); }
  .timer.warn i { background: var(--myth); }
  .tclock { position: relative; width: 50px; height: 50px; flex: none; display: grid; place-items: center; color: var(--fg); }
  .tclock svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .tclock .track { stroke: #3a352e; }
  .tclock .ring { stroke: var(--gold); stroke-linecap: round; }
  .tclock b { position: relative; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tclock.warn { color: #ff8a7d; }
  .tclock.warn .ring { stroke: var(--myth); }
  .tclock.warn b { animation: tpulse 1s ease-in-out infinite; }
  @keyframes tpulse { 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { .tclock.warn b { animation: none; } }
  .bet-ribbon { position: absolute; right: 22px; top: 70px; z-index: 3; font: 700 12px/1 var(--display); letter-spacing: .12em; color: var(--ground); background: var(--gold); padding: 5px 9px; border-radius: 3px; transform: rotate(4deg); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .you small { display: block; margin-top: 3px; font: 500 12px/1.2 var(--body); opacity: .9; }
  .share { display: flex; gap: 4px; justify-content: center; }
  .share i { width: 18px; height: 18px; border-radius: 3px; }
  .share i.ok { background: var(--true); }
  .share i.bad { background: var(--myth); }
  .share i.bet { box-shadow: inset 0 0 0 2px var(--gold); }
  .end .meta { color: var(--fg); font: 600 15px/1.3 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--fg); color: var(--ground); font: 600 14px/1 var(--display); padding: 10px 14px; border-radius: 6px; letter-spacing: .06em; }

  /* action bar */
  .actions { display: grid; gap: 8px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { appearance: none; border: 0; border-radius: 8px; height: 56px; font: 700 19px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: #f7f3ea; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, filter .12s; }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.no { background: var(--myth); }
  .btn.yes { background: var(--true); }
  .btn.next { grid-column: 1 / -1; background: var(--fg); color: var(--ground); }
  .btn svg { width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .wrap, .inner, .btn { transition: none !important; }
    .score.bump { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="wordmark" id="wordmark">True <span>/</span> false</div>
      <div class="pills"><button class="lang icon" id="reset" type="button" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button><button class="lang" id="lang" type="button" aria-label="Language">EN</button><div class="streak" id="streak" hidden aria-label="Серия"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1.5-.6-2.5-1-3.5 3 1.5 5 4.5 5 7.5a7 7 0 0 1-14 0c0-6 7-8 7-13z"/></svg><span id="streakVal">0</span><b id="streakX" hidden>×2</b></div><div class="score" id="score" aria-label="Очки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg><span id="scoreVal">0</span></div></div>
    </div>
    <div class="progress"><div class="segs" id="segs"></div><div class="count" id="count"></div></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="actions">
    <div class="hint" id="hint"></div>
    <div class="btns" id="btns"></div>
  </footer>
</div>

<script>
const ICONS = {
  science: '<svg viewBox="0 0 64 64" fill="none" stroke="#efe9dd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M24 6h16M27 6v18L12 52a5 5 0 0 0 4.5 7h31A5 5 0 0 0 52 52L37 24V6"/><path d="M18 42h28"/></svg>',
  history: '<svg viewBox="0 0 64 64" fill="none" stroke="#efe9dd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 20L32 8l24 12z"/><path d="M8 20h48M10 56h44M6 60h52"/><path d="M15 26v24M26 26v24M38 26v24M49 26v24"/></svg>',
  rulers: '<svg viewBox="0 0 64 64" fill="#efe9dd"><path d="M8 50 4 18l15 12L32 8l13 22 15-12-4 32Z"/><rect x="8" y="53" width="48" height="6" rx="1"/></svg>',
  war: '<svg viewBox="0 0 64 64" fill="none" stroke="#efe9dd" stroke-width="4.5" stroke-linecap="round"><path d="M8 8l36 36M56 8L20 44"/><path d="M38 52l14-14M12 38l14 14"/><path d="M48 48l7 7M16 48l-7 7"/></svg>',
  expedition: '<svg viewBox="0 0 64 64" fill="none" stroke="#efe9dd" stroke-width="4"><circle cx="32" cy="32" r="25"/><path d="M32 13l7 19h-14z" fill="#efe9dd" stroke="none"/><path d="M25 32h14l-7 19z" stroke-width="3" stroke-linejoin="round"/></svg>',
  survival: '<svg viewBox="0 0 64 64" fill="none" stroke="#efe9dd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M32 56C14 44 6 34 6 23a12 12 0 0 1 26-6 12 12 0 0 1 26 6c0 11-8 21-26 33z"/><path d="M8 33h12l5-9 6 17 5-12 3 4h17"/></svg>',

function buildDeck() {

  // 3) otherwise top up with the cards shown longest ago, so nothing returns before the pool has gone round
  const rank = k => seenLog[DECK[k].art] || 0;
  const unseen = shuffle(POOL.filter(k => !rank(k)));
  const count = (arr, v) => arr.filter(k => DECK[k].verdict === v).length;
  let pick = [];
  for (const [v, n] of Object.entries(MIX)) pick.push(...unseen.filter(k => DECK[k].verdict === v).slice(0, n));
  pick.push(...unseen.filter(k => !pick.includes(k)).slice(0, DAILY - pick.length));
  if (unseen.length < 5) {
    const old = shuffle(POOL.filter(k => rank(k))).sort((a, b) => rank(a) - rank(b));

    pick.push(...old.filter(k => !pick.includes(k)).slice(0, DAILY - pick.length));
  }

  if (state.answered === 'timeout') return `<div class="you bad">${T.timeUp}${bet ? T.betLoss(ptsTxt(c.pts)) : ''}</div>`;
  if (ok) {
    const why = [bet && T.xBet, (g / c.pts / (bet ? 2 : 1)) === 2 && T.xStreak].filter(Boolean).join(', ');
    return `<div class="you ok">${T.said(state.answered)}${T.right(ptsTxt(g))}${why ? `<small>${why}</small>` : ''}</div>`;
  }
  return `<div class="you bad">${T.said(state.answered)}${T.wrong}${bet ? T.betLoss(ptsTxt(c.pts)) : ''}</div>`;
}

function renderCard() {
  const c = cur(), n = catNo(), T = t(), C = L(c);
  if (state.phase === 'play') markSeen(c.art);
  const ans = state.answered;
  $('stage').innerHTML = `
    <div class="wrap${state.bet && ans === null ? ' bet-on' : ''}" id="wrap">
      <div class="inner${ans !== null ? ' flipped' : ''}" id="inner">
        <section class="face front" aria-label="${T.story}">
          <div class="vote-stamp yes" id="stYes">${T.stampYes}</div>
          <div class="vote-stamp no" id="stNo">${T.stampNo}</div>
          ${ans === null ? `<div class="timer" id="timer" aria-hidden="true"><i id="timerFill" style="width:${(100 * state.timeLeft / TURN_MS).toFixed(1)}%"></i></div>` : ''}
          ${state.bet && ans === null ? `<div class="bet-ribbon">${T.sure}</div>` : ''}
          ${head(c, n)}
          <div class="art">
            <img src="${c.art}" alt="" style="object-position:${c.pos}">
            <div class="badges">
              <div class="shield"><svg class="sh" viewBox="0 0 76 64" aria-hidden="true"><polygon class="edge" points="0,0 76,0 76,43.5 38,64 0,43.5"/><polygon points="0,0 76,0 76,43.5 38,64 0,43.5"/></svg><div><b>${yearOf(c)}</b><em>${yearLabel(c, T)}</em></div></div>
              <div class="square" role="img" aria-label="${T.cats[c.cat]}" title="${T.cats[c.cat]}"><div>${ICONS[c.cat]}</div></div>
              <div class="shield"><svg class="sh" viewBox="0 0 76 64" aria-hidden="true"><polygon class="edge" points="0,0 76,0 76,43.5 38,64 0,43.5"/><polygon points="0,0 76,0 76,43.5 38,64 0,43.5"/></svg><div><b>${c.pts}</b><em>${T.PT(c.pts)}</em></div></div>
            </div>
          </div>
          <div class="story"><div class="frame-q">${T.frameQ}</div><p>${C.story}</p></div>
        </section>
        <section class="face back" aria-label="${T.answer}">
          ${head(c, n)}
          <div class="strip">
            <img src="${c.art}" alt="" style="object-position:${c.pos}">
            <div class="verdict ${c.verdict}">${T[c.verdict === 'true' ? 'truth' : c.verdict]}</div>
          </div>
          <div class="reveal">
            ${ans !== null ? youLine(c) : ''}
            <div class="label">${T.what}</div>
            <div class="answer">${C.answer.map(p => `<p>${p}</p>`).join('')}</div>
            <p class="source">${C.source}</p>
          </div>
        </section>
      </div>
    </div>`;
  if (ans === null) bindSwipe();
  renderChrome();
}

function renderChrome() {
  const T = t();
  document.documentElement.lang = lang;
  $('wordmark').innerHTML = T.wordmark;
  const lb = $('lang'); lb.textContent = lang === 'en' ? 'RU' : 'EN'; lb.disabled = state.phase === 'shuffle';
  const rb = $('reset'); rb.disabled = state.phase === 'shuffle'; rb.setAttribute('aria-label', T.reset); rb.title = T.reset;
  lb.setAttribute('aria-label', lang === 'en' ? 'Switch to Russian' : 'Switch to English');
  $('score').setAttribute('aria-label', T.score); $('streak').setAttribute('aria-label', T.streak);
  $('scoreVal').textContent = state.score;
  $('streak').hidden = !(state.phase === 'play' || state.phase === 'end') || state.streak === 0;
  $('streakVal').textContent = state.streak;
  $('streakX').hidden = state.streak < 3;
  const N = state.order.length, done = state.phase === 'end';
  $('segs').innerHTML = state.order.map((_, k) => {
    const r = state.results[k];
    const cls = r === true ? 'ok' : r === false ? 'bad' : (state.phase === 'play' && k === state.i ? 'now' : '');
    return `<div class="seg ${cls}"></div>`;
  }).join('');
  $('count').textContent = state.phase === 'play' ? `${state.i + 1} / ${N}` : done ? `${N} / ${N}` : `0 / ${N}`;
  const btns = $('btns'), hint = $('hint');
  if (state.phase === 'start') {
    hint.innerHTML = '';
    btns.innerHTML = `<button class="btn next" id="go">${T.shuffle}</button>`;
    $('go').onclick = shuffleAndDeal;
  } else if (state.phase === 'shuffle') {
    hint.innerHTML = '';
    btns.innerHTML = `<button class="btn next" disabled>${T.shuffling}</button>`;
  } else if (done) {
    hint.innerHTML = '';
    btns.innerHTML = `<button class="btn yes" id="copy">${T.share}</button><button class="btn next" id="again" style="grid-column:auto">${T.again}</button>`;
    $('copy').onclick = copyResult;
    $('again').onclick = () => { state = fresh(); renderStart(); shuffleAndDeal(); };
  } else if (state.answered === null) {
    hint.innerHTML = `<button class="bet" id="bet" aria-pressed="${state.bet}">${T.sure}</button><span class="tclock" id="tclock" role="timer" aria-label="${T.timeLabel}"><svg viewBox="0 0 50 50" fill="none" stroke-width="5" aria-hidden="true"><circle class="track" cx="25" cy="25" r="21"/><circle class="ring" id="tring" cx="25" cy="25" r="21" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><b id="tsec">${Math.ceil(state.timeLeft / 1000)}</b></span><span>${T.swipe}</span>`;
    updateTimer();
    $('bet').onclick = toggleBet;
    btns.innerHTML = `<button class="btn no" id="no">${T.doubt}</button><button class="btn yes" id="yes">${T.believe}</button>`;
    $('no').onclick = () => answer(false);
    $('yes').onclick = () => answer(true);
  } else {
    hint.innerHTML = '';
    const last = state.i === N - 1;
    btns.innerHTML = `<button class="btn next" id="next">${last ? T.results : T.next} ${ARROW}</button>`;
    $('next').onclick = next;
  }
}

function setLang(l) {
  if (state.phase === 'shuffle') return;
  lang = l;
  try { localStorage.setItem('vnv-lang', l); } catch (e) {}
  if (state.phase === 'play') renderCard(); else if (state.phase === 'end') renderEnd(); else renderStart();
}
$('lang').onclick = () => setLang(lang === 'en' ? 'ru' : 'en');

// Start over: an in-page sheet (the artifact viewer has no confirm() dialogs)
function closeReset() { const bg = $('resetSheet'); if (bg) bg.remove(); $('reset').focus(); }
function openReset() {
  if (state.phase === 'shuffle' || $('resetSheet')) return;
  const T = t();
  document.body.insertAdjacentHTML('beforeend', `<div class="sheet-bg" id="resetSheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <h3 id="resetTitle">${T.resetTitle}</h3>
      <button class="opt" id="resetNew" type="button"><b>${T.resetNew}</b><span>${T.resetNewSub}</span></button>
      <button class="opt warn" id="resetAll" type="button"><b>${T.resetAll}</b><span>${T.resetAllSub}</span></button>
      <button class="cancel" id="resetCancel" type="button">${T.cancel}</button>
    </div></div>`);
  const bg = $('resetSheet');
  bg.addEventListener('click', e => { if (e.target === bg) closeReset(); });
  $('resetCancel').onclick = closeReset;
  $('resetNew').onclick = () => doReset(false);
  $('resetAll').onclick = () => doReset(true);
  $('resetNew').focus();
}
function doReset(all) {
  const bg = $('resetSheet'); if (bg) bg.remove();
  if (all) { seenLog = {}; seenTick = 0; saveSeen(); }
  state = fresh();
  renderStart();
}
$('reset').onclick = openReset;

function toggleBet() {
  if (state.phase !== 'play' || state.answered !== null) return;
  state.bet = !state.bet;
  const b = $('bet'); if (b) b.setAttribute('aria-pressed', state.bet);
  const w = $('wrap'); if (w) w.classList.toggle('bet-on', state.bet);
  const front = document.querySelector('.front');
  const rib = front && front.querySelector('.bet-ribbon');
  if (state.bet && !rib && front) front.insertAdjacentHTML('afterbegin', `<div class="bet-ribbon">${t().sure}</div>`);
  if (!state.bet && rib) rib.remove();
}

function answer(believe) {
  if (state.phase !== 'play' || state.answered !== null) return;
  const c = cur(), i = state.i;
  const ok = believe === c.isTrue;
  const g = gainFor(c, ok, state.bet, state.streak);
  state.answered = believe;
  state.results[i] = ok; state.gains[i] = g; state.bets[i] = state.bet;
  markSeen(c.art);
  state.score = Math.max(0, state.score + g);
  state.streak = ok ? state.streak + 1 : 0;
  state.best = Math.max(state.best, state.streak);
  if (g > 0) { const s = $('score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  try { navigator.vibrate && navigator.vibrate(ok ? 20 : [30, 60, 30]); } catch (e) {}
  const wrap = $('wrap'); if (!wrap) return renderCard();
  wrap.style.transition = ''; wrap.style.transform = '';
  renderCard();
}

// Turn timer. It keeps running when the app is in the background (no pausing to look the answer up);
// it stops only while the start-over sheet is open.
function updateTimer() {
  const f = $('timerFill'), sec = $('tsec'), clock = $('tclock'), bar = $('timer');
  const left = Math.max(0, state.timeLeft), warn = left <= 5000;
  if (f) f.style.width = (100 * left / TURN_MS).toFixed(1) + '%';
  if (bar) bar.classList.toggle('warn', warn);
  if (sec) sec.textContent = Math.ceil(left / 1000);
  if (clock) clock.classList.toggle('warn', warn);
  const ring = $('tring'); if (ring) ring.setAttribute('stroke-dashoffset', (100 - 100 * left / TURN_MS).toFixed(2));
}
let lastTick = null;
setInterval(() => {
  const now = Date.now();
  const running = state.phase === 'play' && state.answered === null && !$('resetSheet');
  if (running && lastTick !== null) {
    state.timeLeft -= now - lastTick;
    updateTimer();
    if (state.timeLeft <= 0) { state.timeLeft = 0; answer('timeout'); }
  }
  lastTick = running ? now : null;
}, 100);

function next() {
  const wrap = $('wrap');
  const go = () => {
    state.i += 1; state.answered = null; state.bet = false; state.timeLeft = TURN_MS;
    if (state.i >= state.order.length) { state.phase = 'end'; renderEnd(); return; }
    renderCard();
    if (reduce) return;
    const w = $('wrap');
    w.classList.add('entering');
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.remove('entering')));
  };
  if (reduce || !wrap) return go();
  wrap.classList.add('leaving');
  setTimeout(go, 300);
}

function shareText() {
  const T = t(), sq = state.results.map(r => r ? '🟩' : '🟥').join('');
  return `${T.shareHead(dayLabel())}\n${sq}\n${T.shareTail(state.score, state.best)}`;
}

function renderEnd() {
  const T = t(), right = state.results.filter(Boolean).length, N = state.order.length;
  $('stage').innerHTML = `<div class="end">
    <div class="meta">${T.endMeta(dayLabel())}</div>
    <div class="big">${state.score}</div>
    <p>${T.endLine(state.score, right, N, state.best)}</p>
    <div class="share">${state.results.map((r, k) => `<i class="${r ? 'ok' : 'bad'}${state.bets[k] ? ' bet' : ''}"></i>`).join('')}</div>
    <p>${T.endNote}</p>
  </div>`;
  renderChrome();
}

function copyResult() {
  const text = shareText(), T = t();
  const toast = msg => { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 1600); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:16px;right:16px;bottom:130px;height:84px;font:14px var(--body)';
    document.body.appendChild(ta); ta.focus(); ta.select(); toast(T.copyManual); setTimeout(() => ta.remove(), 6000);
  };
  try { navigator.clipboard.writeText(text).then(() => toast(T.copied), fallback); } catch (e) { fallback(); }
}

const BACK_SRC = 'back-munchausen-sm.jpg';
const BACK = `<img src="${BACK_SRC}" alt="" decoding="sync">`;
// Decode the card back once before any animation, so WebKit never shows an empty layer mid-shuffle
const backReady = (() => { const im = new Image(); im.src = BACK_SRC; return (im.decode ? im.decode() : Promise.resolve()).catch(() => {}); })();
const DECK_SIZE = 10;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const T = (x, y, r = 0, sc = 1) => `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${r}deg) scale(${sc})`;
const rest = k => T(0, -k * 1.5);

function renderStart() {
  const L10 = t();
  $('stage').innerHTML = `<div class="start">
    <div class="deck" id="deck">${Array.from({ length: DECK_SIZE }, (_, k) => `<div class="cb" style="z-index:${k};transform:${rest(k)}">${BACK}</div>`).join('')}</div>
    <div class="start-copy" id="startCopy"><h2>${L10.daily}</h2><p>${L10.startText(state.order.filter(k => !seenLog[DECK[k].art]).length, state.order.length)}</p></div>
  </div>`;
  document.querySelectorAll('#deck .cb').forEach((el, k) => { el._t = rest(k); });
  renderChrome();
}

function move(el, to, duration, delay = 0, easing = 'cubic-bezier(.3,.7,.2,1)', via = null) {
  const frames = via ? [{ transform: el._t }, { transform: via }, { transform: to }] : [{ transform: el._t }, { transform: to }];
  const anim = el.animate(frames, { duration, delay, easing, fill: 'both' });
  el._t = to;
  return anim.finished.then(() => { el.style.transform = to; anim.cancel(); });
}

async function riffle() {
  let stack = [...document.querySelectorAll('#deck .cb')];
  const W = stack[0].offsetWidth, SW = $('stage').offsetWidth;
  const spread = Math.min(W * 0.36, (SW - W) / 2 + W * 0.06);
  for (let round = 0; round < 3; round++) {
    const h = Math.ceil(stack.length / 2), lower = stack.slice(0, h), upper = stack.slice(h);
    // cut: the lower half slides left, the upper half slides right
    await Promise.all(stack.map((el, k) => {
      const left = k < h, j = left ? k : k - h;
      return move(el, T((left ? -1 : 1) * spread, -j * 1.5 + 10, left ? -8 : 8), 240);
    }));
    // riffle: the halves interleave card by card back into one stack
    const merged = [];
    let a = 0, b = 0, fromLeft = Math.random() < 0.5;
    while (a < lower.length || b < upper.length) {
      if ((fromLeft && a < lower.length) || b >= upper.length) merged.push(lower[a++]); else merged.push(upper[b++]);
      fromLeft = !fromLeft;
    }
    await Promise.all(merged.map((el, k) => {
      el.style.zIndex = k;
      const side = lower.includes(el) ? -1 : 1;
      return move(el, rest(k), 230, k * 34, 'cubic-bezier(.45,0,.2,1)', T(side * W * 0.14, -k * 1.5 - 22, side * 4));
    }));
    stack = merged;
  }
  // square the deck: one soft tap on the table
  await Promise.all(stack.map((el, k) => el.animate(
    [{ transform: rest(k) }, { transform: T(0, -k * 1.5 + 4, 0, 1.025) }, { transform: rest(k) }],
    { duration: 260, easing: 'ease-out' }).finished));
  return stack;
}

async function deal(stack) {
  const top = stack[stack.length - 1];
  const sr = $('stage').getBoundingClientRect(), r = top.getBoundingClientRect();
  const sc = Math.min(sr.width / r.width, sr.height / r.height);
  const dx = (sr.left + sr.width / 2) - (r.left + r.width / 2), dy = (sr.top + sr.height / 2) - (r.top + r.height / 2);
  const copy = $('startCopy'); if (copy) copy.style.opacity = 0;
  await Promise.all([
    ...stack.slice(0, -1).map((el, k) => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, delay: 60, fill: 'forwards' }).finished),
    move(top, T(dx, dy, 0, sc), 360)
  ]);
  await top.animate([{ transform: top._t }, { transform: top._t + ' rotateY(90deg)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' }).finished;
}

async function shuffleAndDeal() {
  if (state.phase === 'shuffle') return;
  if (!$('deck')) renderStart();
  state.phase = 'shuffle';
  renderChrome();
  await backReady;
  if (!reduce) {
    await sleep(80);
    const stack = await riffle();
    await deal(stack);
  }
  state.phase = 'play';
  state.timeLeft = TURN_MS;
  renderCard();
  if (!reduce) $('wrap').animate([{ transform: 'perspective(1400px) rotateY(-90deg)' }, { transform: 'perspective(1400px) rotateY(0)' }], { duration: 200, easing: 'ease-out' });
}

function bindSwipe() {
  const wrap = $('wrap'), yes = $('stYes'), no = $('stNo');
  let x0 = null, dx = 0, id = null;
  const TH = 100;
  wrap.addEventListener('pointerdown', e => {
    if (state.answered !== null) return;
    x0 = e.clientX; dx = 0; id = e.pointerId;
    wrap.setPointerCapture(id);
    wrap.style.transition = 'none';
  });
  wrap.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    wrap.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / TH));
    no.style.opacity = Math.max(0, Math.min(1, -dx / TH));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    wrap.style.transition = '';
    if (Math.abs(dx) > TH) { answer(dx > 0); return; }
    wrap.style.transform = '';
    yes.style.opacity = 0; no.style.opacity = 0;
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
}

document.addEventListener('keydown', e => {
  if ($('resetSheet')) { if (e.key === 'Escape') closeReset(); return; }
  if (state.phase === 'start') { if (e.key === 'Enter') shuffleAndDeal(); return; }
  if (state.phase !== 'play') return;
  if (state.answered === null) {
    if (e.key === 'ArrowRight') answer(true);
    if (e.key === 'ArrowLeft') answer(false);
    if (e.key === 'ArrowUp') toggleBet();
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') next();
});

const hot = window.claude?.hot;
hot?.snapshot?.(() => ({ ...state, seenLog, seenTick }));
const start = data => {
  if (data && data.seenLog && typeof data.seenLog === 'object' && (data.seenTick || 0) >= seenTick) { seenLog = data.seenLog; seenTick = data.seenTick || 0; saveSeen(); }
  if (data && data.day === DAY_KEY && Array.isArray(data.order) && data.phase !== 'shuffle') { const { seenLog: _l, seenTick: _t, ...rest } = data; state = { ...state, ...rest }; }
  const qs = new URLSearchParams(location.search);
  if (qs.has('lang')) lang = qs.get('lang') === 'ru' ? 'ru' : 'en';
  if (qs.has('i')) {
    state.phase = 'play'; state.order = DECK.map((_, k) => k);
    state.i = Math.min(DECK.length - 1, +qs.get('i') || 0);
    if (qs.has('bet')) state.bet = true;
    if (qs.has('a')) { const c = cur(); state.answered = c.isTrue; state.results[state.i] = true; state.bets[state.i] = qs.has('bet'); state.gains[state.i] = gainFor(c, true, qs.has('bet'), 0); }
  }
  if (qs.has('end')) {
    state.phase = 'end';
    state.results = state.order.map((_, k) => k % 4 !== 2); state.bets = state.order.map((_, k) => k % 3 === 0);
    state.score = 17; state.best = 5;
  }
  if (state.phase === 'play') renderCard();
  else if (state.phase === 'end') renderEnd();
  else { state.phase = 'start'; renderStart(); }
};
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
